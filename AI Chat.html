<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Chat</title>

<!-- Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- HTML 安全过滤 -->
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
}

body {
    background: #f5f5f5;
    color: #222;
}

button,
textarea,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* ================================
   APP
================================ */

.app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}

/* ================================
   HEADER
================================ */

.header {
    height: 60px;
    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 0 18px;

    background: #ffffff;

    border-bottom: 1px solid #e8e8e8;
}

.title {
    font-size: 18px;
    font-weight: 600;
}

.status {
    margin-left: 10px;

    font-size: 12px;

    color: #999;
}

/* ================================
   CHAT
================================ */

.chat {
    flex: 1;

    overflow-y: auto;

    padding: 24px 16px;

    scroll-behavior: smooth;
}

.message {
    display: flex;

    width: 100%;

    margin-bottom: 18px;
}

.message.user {
    justify-content: flex-end;
}

.message.assistant {
    justify-content: flex-start;
}

.avatar {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 15px;

    user-select: none;
}

.assistant .avatar {
    background: #e8e8e8;

    margin-right: 10px;
}

.user .avatar {
    background: #07c160;

    color: #fff;

    margin-left: 10px;

    order: 2;
}

.bubble-wrapper {
    max-width: min(72%, 800px);

    min-width: 0;
}

.bubble {
    padding: 10px 13px;

    border-radius: 8px;

    line-height: 1.6;

    font-size: 15px;

    word-break: break-word;
}

.assistant .bubble {
    background: #fff;

    border: 1px solid #eee;
}

.user .bubble {
    background: #95ec69;
}

/* ================================
   MESSAGE ACTIONS
================================ */

.message-actions {
    display: none;

    margin-top: 5px;

    gap: 6px;
}

.message:hover .message-actions {
    display: flex;
}

.message-actions button {
    border: none;

    background: transparent;

    color: #888;

    font-size: 12px;
}

.message-actions button:hover {
    color: #333;
}

/* ================================
   MARKDOWN
================================ */

.bubble p {
    margin: 0 0 8px;
}

.bubble p:last-child {
    margin-bottom: 0;
}

.bubble ul,
.bubble ol {
    padding-left: 24px;
}

.bubble blockquote {
    margin: 8px 0;

    padding-left: 12px;

    border-left: 3px solid #ccc;

    color: #777;
}

.bubble table {
    width: 100%;

    border-collapse: collapse;

    margin: 10px 0;
}

.bubble th,
.bubble td {
    padding: 6px 10px;

    border: 1px solid #ddd;
}

.bubble a {
    color: #1677ff;
}

/* ================================
   CODE BLOCK
================================ */

.code-block {
    position: relative;

    margin: 10px 0;
}

.code-block pre {
    overflow-x: auto;

    margin: 0;

    padding: 40px 12px 12px;

    border-radius: 7px;

    background: #1e1e1e;

    color: #eee;

    line-height: 1.5;
}

.code-block code {
    font-family:
        Consolas,
        Monaco,
        "Courier New",
        monospace;

    font-size: 13px;
}

.bubble :not(pre) > code {
    padding: 2px 5px;

    border-radius: 4px;

    background: #eeeeee;

    font-family:
        Consolas,
        Monaco,
        monospace;
}

/* ================================
   COPY BUTTON
================================ */

.copy-code-btn {
    position: absolute;

    top: 8px;
    right: 8px;

    padding: 4px 9px;

    border: 1px solid rgba(255, 255, 255, .15);

    border-radius: 5px;

    background: rgba(255, 255, 255, .08);

    color: #ccc;

    font-size: 12px;

    cursor: pointer;

    transition:
        background .15s,
        color .15s;
}

.copy-code-btn:hover {
    background: rgba(255, 255, 255, .16);

    color: #fff;
}

.copy-code-btn.copied {
    color: #07c160;
}

/* ================================
   INPUT
================================ */

.input-area {
    flex-shrink: 0;

    padding: 12px 16px 16px;

    background: #fff;

    border-top: 1px solid #e8e8e8;
}

.input-box {
    max-width: 900px;

    margin: auto;

    display: flex;

    gap: 8px;
}

#input {
    flex: 1;

    resize: none;

    min-height: 44px;
    max-height: 160px;

    padding: 11px 13px;

    border: 1px solid #ddd;

    border-radius: 8px;

    outline: none;

    font-size: 15px;

    line-height: 1.5;

    background: #fff;

    color: #222;
}

#input:focus {
    border-color: #07c160;
}

.send-btn,
.stop-btn {
    width: 72px;

    border: none;

    border-radius: 8px;

    font-size: 14px;
}

.send-btn {
    background: #07c160;

    color: white;
}

.send-btn:hover {
    background: #06ad56;
}

.stop-btn {
    display: none;

    background: #ff4d4f;

    color: white;
}

.stop-btn:hover {
    background: #e63b3d;
}

/* ================================
   BOTTOM TOOLS
================================ */

.bottom-tools {
    max-width: 900px;

    margin: 8px auto 0;

    display: flex;

    justify-content: space-between;
}

.tool-group {
    display: flex;

    gap: 12px;
}

.tool-btn {
    border: none;

    background: transparent;

    color: #888;

    font-size: 12px;
}

.tool-btn:hover {
    color: #333;
}

/* ================================
   SETTINGS
================================ */

.settings {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, .35);

    z-index: 100;
}

.settings.show {
    display: flex;
}

.settings-panel {
    width: min(92vw, 600px);

    max-height: 90vh;

    overflow-y: auto;

    padding: 22px;

    background: #fff;

    border-radius: 12px;

    box-shadow:
        0 10px 40px rgba(0, 0, 0, .2);
}

.settings-panel h2 {
    margin-top: 0;

    margin-bottom: 22px;
}

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    color: #555;
}

.field input,
.field textarea {
    width: 100%;

    padding: 10px;

    border: 1px solid #ddd;

    border-radius: 7px;

    outline: none;

    font-size: 14px;

    background: #fff;

    color: #222;
}

.field input:focus,
.field textarea:focus {
    border-color: #07c160;
}

.field textarea {
    min-height: 180px;

    resize: vertical;
}

.settings-buttons {
    display: flex;

    justify-content: flex-end;

    gap: 8px;
}

.settings-buttons button {
    padding: 9px 16px;

    border: none;

    border-radius: 7px;

    font-size: 14px;
}

.save-settings {
    background: #07c160;

    color: white;
}

.cancel-settings {
    background: #eee;

    color: #333;
}

/* ================================
   DARK MODE
================================ */

@media (prefers-color-scheme: dark) {

    body {
        background: #181818;

        color: #eee;
    }

    .header,
    .input-area {
        background: #222;

        border-color: #333;
    }

    .assistant .bubble {
        background: #262626;

        border-color: #333;
    }

    .assistant .avatar {
        background: #333;
    }

    #input,
    .field input,
    .field textarea {
        background: #292929;

        color: #eee;

        border-color: #444;
    }

    #input:focus,
    .field input:focus,
    .field textarea:focus {
        border-color: #07c160;
    }

    .tool-btn,
    .message-actions button {
        color: #aaa;
    }

    .tool-btn:hover,
    .message-actions button:hover {
        color: #fff;
    }

    .settings-panel {
        background: #222;

        color: #eee;
    }

    .field label {
        color: #bbb;
    }

    .field input,
    .field textarea {
        background: #292929;
    }

    .cancel-settings {
        background: #333;

        color: #fff;
    }

    .bubble :not(pre) > code {
        background: #333;
    }

    .bubble blockquote {
        border-color: #555;

        color: #aaa;
    }

    .bubble th,
    .bubble td {
        border-color: #444;
    }
}

/* ================================
   MOBILE
================================ */

@media (max-width: 700px) {

    .chat {
        padding: 16px 10px;
    }

    .bubble-wrapper {
        max-width: 82%;
    }

    .avatar {
        width: 34px;
        height: 34px;
    }

    .bubble {
        font-size: 14px;
    }

    .input-area {
        padding: 8px 10px 10px;
    }

    .send-btn,
    .stop-btn {
        width: 60px;
    }
}

</style>
</head>

<body>

<script>

/* =========================================================
   API 配置

   直接修改这里即可。

   例如：

   API_URL:
   https://api.openai.com/v1/chat/completions

   API_KEY:
   sk-xxxxxxxx

   MODEL:
   gpt-4o-mini

========================================================= */

const CONFIG = {

    API_URL:
        "https://api.openai.com/v1/chat/completions",

    API_KEY:
        "YOUR_API_KEY",

    MODEL:
        "gpt-4o-mini",

    SYSTEM_PROMPT:
        "你是一个友好的AI助手。请自然地与用户交流。"

};


/* =========================================================
   全局状态
========================================================= */

let messages = [];

let controller = null;

let generating = false;


/* =========================================================
   DOM
========================================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendBtn =
    document.getElementById("sendBtn");

const stopBtn =
    document.getElementById("stopBtn");

const status =
    document.getElementById("status");

const settings =
    document.getElementById("settings");

const apiUrl =
    document.getElementById("apiUrl");

const apiKey =
    document.getElementById("apiKey");

const model =
    document.getElementById("model");

const systemPrompt =
    document.getElementById("systemPrompt");


/* =========================================================
   localStorage
========================================================= */

function saveMessages() {

    localStorage.setItem(
        "ai_chat_messages",
        JSON.stringify(messages)
    );

}


function loadMessages() {

    try {

        const saved =
            localStorage.getItem(
                "ai_chat_messages"
            );

        if (saved) {

            const parsed =
                JSON.parse(saved);

            if (Array.isArray(parsed)) {

                messages = parsed;

            }

        }

    } catch (error) {

        console.warn(
            "聊天记录读取失败：",
            error
        );

        messages = [];

    }

}


/* =========================================================
   Markdown
========================================================= */

function renderMarkdown(text) {

    /*
     * marked 负责 Markdown → HTML
     */

    const html =
        marked.parse(text || "");


    /*
     * DOMPurify 防止 AI 返回恶意 HTML
     */

    const safeHtml =
        DOMPurify.sanitize(html);


    /*
     * 创建临时 DOM
     */

    const container =
        document.createElement("div");

    container.innerHTML =
        safeHtml;


    /*
     * 给每一个代码块增加复制按钮
     */

    const codeBlocks =
        container.querySelectorAll("pre");


    codeBlocks.forEach(pre => {

        const code =
            pre.querySelector("code");


        if (!code) {
            return;
        }


        /*
         * 防止重复添加
         */

        if (
            pre.parentElement &&
            pre.parentElement.classList.contains(
                "code-block"
            )
        ) {

            return;

        }


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "code-block";


        const copyButton =
            document.createElement("button");

        copyButton.className =
            "copy-code-btn";

        copyButton.type =
            "button";

        copyButton.textContent =
            "复制";


        copyButton.addEventListener(
            "click",
            async () => {

                const codeText =
                    code.textContent;


                try {

                    /*
                     * 优先使用现代 Clipboard API
                     */

                    await navigator.clipboard.writeText(
                        codeText
                    );


                    copyButton.textContent =
                        "已复制";

                    copyButton.classList.add(
                        "copied"
                    );


                    setTimeout(() => {

                        copyButton.textContent =
                            "复制";

                        copyButton.classList.remove(
                            "copied"
                        );

                    }, 1500);


                } catch (error) {

                    /*
                     * file:// 页面或者部分浏览器
                     * 可能不允许 navigator.clipboard。
                     *
                     * 使用旧式复制方法作为备用方案。
                     */

                    const textarea =
                        document.createElement(
                            "textarea"
                        );


                    textarea.value =
                        codeText;


                    textarea.style.position =
                        "fixed";

                    textarea.style.left =
                        "-9999px";


                    document.body.appendChild(
                        textarea
                    );


                    textarea.focus();

                    textarea.select();


                    try {

                        const success =
                            document.execCommand(
                                "copy"
                            );


                        if (success) {

                            copyButton.textContent =
                                "已复制";

                            copyButton.classList.add(
                                "copied"
                            );


                            setTimeout(() => {

                                copyButton.textContent =
                                    "复制";

                                copyButton.classList.remove(
                                    "copied"
                                );

                            }, 1500);

                        } else {

                            copyButton.textContent =
                                "复制失败";

                        }

                    } finally {

                        textarea.remove();

                    }

                }

            }
        );


        /*
         * 把 pre 从原来的位置
         * 移动到 wrapper 中
         */

        pre.parentNode.insertBefore(
            wrapper,
            pre
        );


        wrapper.appendChild(pre);

        wrapper.appendChild(copyButton);

    });


    return container.innerHTML;

}


/* =========================================================
   渲染全部消息
========================================================= */

function renderMessages() {

    chat.innerHTML = "";


    messages.forEach(
        (message, index) => {

            addMessageElement(
                message.role,
                message.content,
                index
            );

        }
    );


    scrollBottom();

}


/* =========================================================
   添加消息 DOM
========================================================= */

function addMessageElement(
    role,
    content,
    index
) {

    const message =
        document.createElement("div");


    message.className =
        "message " +
        (
            role === "user"
                ? "user"
                : "assistant"
        );


    /* Avatar */

    const avatar =
        document.createElement("div");


    avatar.className =
        "avatar";


    avatar.textContent =
        role === "user"
            ? "你"
            : "AI";


    /* Wrapper */

    const wrapper =
        document.createElement("div");


    wrapper.className =
        "bubble-wrapper";


    /* Bubble */

    const bubble =
        document.createElement("div");


    bubble.className =
        "bubble";


    if (role === "assistant") {

        bubble.innerHTML =
            renderMarkdown(content);

    } else {

        bubble.textContent =
            content;

    }


    wrapper.appendChild(bubble);


    /* =====================================================
       编辑用户消息
    ===================================================== */

    if (role === "user") {

        const actions =
            document.createElement("div");


        actions.className =
            "message-actions";


        const edit =
            document.createElement("button");


        edit.type =
            "button";

        edit.textContent =
            "编辑";


        edit.addEventListener(
            "click",
            () => {

                /*
                 * 把消息放回输入框
                 */

                input.value =
                    content;


                input.focus();


                /*
                 * 删除当前消息及其之后的所有消息。
                 *
                 * 例如：
                 *
                 * 用户A
                 * AI A
                 * 用户B ← 编辑
                 * AI B
                 *
                 * 变成：
                 *
                 * 用户A
                 * AI A
                 *
                 * 然后用户可以重新发送 B。
                 */

                messages.splice(index);


                saveMessages();

                renderMessages();

            }
        );


        actions.appendChild(edit);

        wrapper.appendChild(actions);

    }


    /*
     * 用户消息：
     *
     * bubble + avatar
     *
     * AI消息：
     *
     * avatar + bubble
     */

    if (role === "user") {

        message.appendChild(wrapper);

        message.appendChild(avatar);

    } else {

        message.appendChild(avatar);

        message.appendChild(wrapper);

    }


    chat.appendChild(message);

}


/* =========================================================
   滚动到底部
========================================================= */

function scrollBottom() {

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================================
   发送消息
========================================================= */

async function sendMessage() {

    if (generating) {
        return;
    }


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    /*
     * 添加用户消息
     */

    messages.push({

        role: "user",

        content: text

    });


    input.value = "";


    saveMessages();

    renderMessages();


    /*
     * 请求 AI
     */

    await requestAI();

}


/* =========================================================
   流式请求
========================================================= */

async function requestAI() {

    generating = true;


    controller =
        new AbortController();


    sendBtn.style.display =
        "none";

    stopBtn.style.display =
        "block";


    status.textContent =
        "连接中……";


    /*
     * 先创建一个空的 AI 消息。
     *
     * 后面每收到一个 chunk，
     * 就不断修改它。
     */

    const assistantMessage = {

        role: "assistant",

        content: ""

    };


    messages.push(
        assistantMessage
    );


    renderMessages();


    /*
     * 构造 API 消息。
     *
     * 最后一个空 AI 消息不能发给 API，
     * 所以使用 slice(0, -1)。
     */

    const apiMessages = [

        {
            role: "system",

            content:
                getSystemPrompt()
        },

        ...messages
            .slice(0, -1)
            .map(message => ({

                role: message.role,

                content: message.content

            }))

    ];


    try {

        /*
         * 发起请求
         */

        const response =
            await fetch(
                getApiUrl(),
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            getApiKey(),

                        "Accept":
                            "text/event-stream"

                    },

                    body:
                        JSON.stringify({

                            model:
                                getModel(),

                            messages:
                                apiMessages,

                            temperature:
                                1,

                            stream:
                                true

                        }),

                    signal:
                        controller.signal

                }
            );


        /*
         * HTTP 错误
         */

        if (!response.ok) {

            const errorText =
                await response.text();


            throw new Error(
                "HTTP " +
                response.status +
                ": " +
                errorText
            );

        }


        /*
         * 某些浏览器/API可能没有 body
         */

        if (!response.body) {

            throw new Error(
                "API 没有返回可读取的响应流"
            );

        }


        status.textContent =
            "生成中……";


        /*
         * 获取 ReadableStream
         */

        const reader =
            response.body.getReader();


        const decoder =
            new TextDecoder("utf-8");


        let buffer = "";

        let finished = false;


        /*
         * 不断读取 SSE
         */

        while (!finished) {

            const {
                value,
                done
            } =
                await reader.read();


            if (done) {

                break;

            }


            /*
             * 将 Uint8Array 解码为字符串
             */

            buffer +=
                decoder.decode(
                    value,
                    {
                        stream: true
                    }
                );


            /*
             * SSE 消息一般由两个换行符分隔：
             *
             * data: {...}
             *
             * data: {...}
             *
             */

            const parts =
                buffer.split("\n\n");


            /*
             * 最后一段可能还没有接收完整，
             * 留到下一次继续处理。
             */

            buffer =
                parts.pop() || "";


            /*
             * 逐条处理 SSE
             */

            for (
                const part of parts
            ) {

                const lines =
                    part.split("\n");


                for (
                    let line of lines
                ) {

                    line =
                        line.trim();


                    if (!line) {
                        continue;
                    }


                    /*
                     * 只处理：
                     *
                     * data: ...
                     */

                    if (
                        !line.startsWith(
                            "data:"
                        )
                    ) {

                        continue;

                    }


                    const data =
                        line
                            .slice(5)
                            .trim();


                    /*
                     * OpenAI 标准结束标记
                     */

                    if (
                        data ===
                        "[DONE]"
                    ) {

                        finished =
                            true;

                        break;

                    }


                    /*
                     * JSON
                     */

                    try {

                        const json =
                            JSON.parse(data);


                        /*
                         * OpenAI Chat Completions
                         *
                         * choices[0].delta.content
                         */

                        const delta =
                            json
                                ?.choices?.[0]
                                ?.delta?.content;


                        if (
                            typeof delta ===
                            "string"
                        ) {

                            assistantMessage.content
                                += delta;


                            /*
                             * 实时更新最后一个
                             * AI 气泡。
                             */

                            updateLastAssistantMessage();

                        }


                        /*
                         * 部分兼容 API 不一定发送 [DONE]，
                         * 但会发送 finish_reason。
                         */

                        const finishReason =
                            json
                                ?.choices?.[0]
                                ?.finish_reason;


                        if (
                            finishReason
                        ) {

                            finished =
                                true;

                        }

                    } catch (error) {

                        /*
                         * 不让单个坏 chunk
                         * 直接终止整个请求。
                         */

                        console.warn(
                            "SSE 数据解析失败：",
                            data
                        );

                    }

                }

            }


            if (finished) {

                try {

                    await reader.cancel();

                } catch {}

                break;

            }

        }


        /*
         * 流式结束
         */

        saveMessages();

        status.textContent =
            "就绪";


    } catch (error) {

        /*
         * 用户主动点击停止
         */

        if (
            error.name ===
            "AbortError"
        ) {

            status.textContent =
                "已停止";


            /*
             * 已经生成的内容保留。
             */

            saveMessages();


            renderMessages();


            return;

        }


        /*
         * 其他错误
         */

        console.error(error);


        status.textContent =
            "请求失败";


        /*
         * 如果一个字都没有收到，
         * 删除空 AI 消息。
         */

        if (
            assistantMessage.content
                .trim() === ""
        ) {

            messages.pop();

        } else {

            /*
             * 已经生成部分内容时，
             * 在后面注明错误。
             */

            assistantMessage.content +=
                "\n\n**请求异常：** `" +
                error.message +
                "`";

        }


        saveMessages();

        renderMessages();

    } finally {

        generating =
            false;


        controller =
            null;


        sendBtn.style.display =
            "block";


        stopBtn.style.display =
            "none";

    }

}


/* =========================================================
   实时更新最后一个 AI 消息
========================================================= */

function updateLastAssistantMessage() {

    const bubbles =
        chat.querySelectorAll(
            ".assistant .bubble"
        );


    if (!bubbles.length) {
        return;
    }


    const bubble =
        bubbles[bubbles.length - 1];


    const message =
        messages[messages.length - 1];


    if (
        !message ||
        message.role !==
            "assistant"
    ) {

        return;

    }


    /*
     * 重新解析 Markdown。
     *
     * 因为流式输出过程中可能刚好生成：
     *
     * ```
     *
     * 所以每次重新解析可以让代码块
     * 随生成过程动态出现。
     */

    bubble.innerHTML =
        renderMarkdown(
            message.content
        );


    scrollBottom();

}


/* =========================================================
   停止生成
========================================================= */

function stopGeneration() {

    if (!controller) {
        return;
    }


    status.textContent =
        "正在停止……";


    controller.abort();

}


/* =========================================================
   配置读取
========================================================= */

function getApiUrl() {

    return (
        localStorage.getItem(
            "ai_chat_api_url"
        )
        ||
        CONFIG.API_URL
    );

}


function getApiKey() {

    return (
        localStorage.getItem(
            "ai_chat_api_key"
        )
        ||
        CONFIG.API_KEY
    );

}


function getModel() {

    return (
        localStorage.getItem(
            "ai_chat_model"
        )
        ||
        CONFIG.MODEL
    );

}


function getSystemPrompt() {

    return (
        localStorage.getItem(
            "ai_chat_system_prompt"
        )
        ||
        CONFIG.SYSTEM_PROMPT
    );

}


/* =========================================================
   设置窗口
========================================================= */

function openSettings() {

    apiUrl.value =
        getApiUrl();

    apiKey.value =
        getApiKey();

    model.value =
        getModel();

    systemPrompt.value =
        getSystemPrompt();


    settings.classList.add(
        "show"
    );

}


function closeSettings() {

    settings.classList.remove(
        "show"
    );

}


function saveSettings() {

    localStorage.setItem(
        "ai_chat_api_url",
        apiUrl.value.trim()
    );


    localStorage.setItem(
        "ai_chat_api_key",
        apiKey.value.trim()
    );


    localStorage.setItem(
        "ai_chat_model",
        model.value.trim()
    );


    localStorage.setItem(
        "ai_chat_system_prompt",
        systemPrompt.value
    );


    closeSettings();


    status.textContent =
        "设置已保存";

}


/* =========================================================
   清空聊天
========================================================= */

function clearChat() {

    if (
        !confirm(
            "确定要清空全部聊天记录吗？"
        )
    ) {

        return;

    }


    /*
     * 如果正在生成，
     * 先停止请求。
     */

    if (controller) {

        controller.abort();

    }


    messages = [];


    saveMessages();

    renderMessages();


    status.textContent =
        "聊天已清空";

}


/* =========================================================
   导出聊天
========================================================= */

function exportChat() {

    if (!messages.length) {

        alert(
            "目前没有聊天记录。"
        );

        return;

    }


    const text =
        messages
            .map(message => {

                const name =
                    message.role ===
                    "user"
                        ? "你"
                        : "AI";


                return (
                    name +
                    "：\n" +
                    message.content
                );

            })
            .join(
                "\n\n----------------\n\n"
            );


    const blob =
        new Blob(
            [text],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement("a");


    a.href =
        url;


    a.download =
        "chat-" +
        new Date()
            .toISOString()
            .slice(0, 10) +
        ".txt";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(
        url
    );

}


/* =========================================================
   Enter 发送
========================================================= */

input.addEventListener(
    "keydown",
    event => {

        /*
         * Enter：
         * 发送
         *
         * Shift + Enter：
         * 换行
         */

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   自动调整输入框高度
========================================================= */

input.addEventListener(
    "input",
    () => {

        input.style.height =
            "auto";


        input.style.height =
            Math.min(
                input.scrollHeight,
                160
            ) + "px";

    }
);


/* =========================================================
   点击设置
========================================================= */

document
    .getElementById(
        "settingsBtn"
    )
    .addEventListener(
        "click",
        openSettings
    );


/* =========================================================
   取消设置
========================================================= */

document
    .getElementById(
        "cancelSettings"
    )
    .addEventListener(
        "click",
        closeSettings
    );


/* =========================================================
   保存设置
========================================================= */

document
    .getElementById(
        "saveSettings"
    )
    .addEventListener(
        "click",
        saveSettings
    );


/* =========================================================
   发送
========================================================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   停止
========================================================= */

stopBtn.addEventListener(
    "click",
    stopGeneration
);


/* =========================================================
   清空
========================================================= */

document
    .getElementById(
        "clearBtn"
    )
    .addEventListener(
        "click",
        clearChat
    );


/* =========================================================
   导出
========================================================= */

document
    .getElementById(
        "exportBtn"
    )
    .addEventListener(
        "click",
        exportChat
    );


/* =========================================================
   点击遮罩关闭设置
========================================================= */

settings.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            settings
        ) {

            closeSettings();

        }

    }
);


/* =========================================================
   初始化
========================================================= */

loadMessages();

renderMessages();

</script>

</body>
</html>
